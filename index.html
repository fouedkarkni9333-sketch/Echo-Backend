<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - The Secret Mirror</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e0e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #151821;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 107, 107, 0.1);
            border: 1px solid #232736;
            position: relative;
            text-align: center;
        }

        .settings-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #8b95a5;
            font-size: 1.2rem;
            cursor: pointer;
            width: auto;
            padding: 5px;
            box-shadow: none;
        }

        [dir="rtl"] .settings-icon {
            left: auto;
            right: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #ff6b6b;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #8b95a5;
            margin-bottom: 25px;
        }

        .section {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="text"], textarea, select {
            width: 100%;
            background-color: #0b0c10;
            border: 1px solid #2a2f42;
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.3);
        }

        textarea {
            resize: none;
            height: 110px;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .invite-box {
            background: #1c202e;
            border: 1px dashed #ff8e53;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #ff8e53;
            word-break: break-all;
        }

        .feed {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        [dir="rtl"] .feed {
            text-align: right;
        }

        .feed::-webkit-scrollbar {
            width: 4px;
        }

        .feed::-webkit-scrollbar-thumb {
            background: #2a2f42;
            border-radius: 4px;
        }

        .echo-card {
            background: #1c202e;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #d1d7e0;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        [dir="ltr"] .echo-card {
            border-left: 3px solid #ff6b6b;
        }

        [dir="rtl"] .echo-card {
            border-right: 3px solid #ff6b6b;
        }

        .echo-card .glow-btn {
            background: none;
            border: none;
            color: #ff8e53;
            font-size: 0.8rem;
            width: auto;
            padding: 0;
            margin-top: 8px;
            box-shadow: none;
            cursor: pointer;
            display: inline-block;
        }

        .alert {
            color: #ff4757;
            font-size: 0.8rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- زر الإعدادات -->
    <button class="settings-icon" onclick="toggleSettings()">⚙️</button>

    <h1 id="app-title">Echo</h1>
    <p class="subtitle" id="app-subtitle">The Secret World of Anonymous Confessions</p>

    <!-- شاشة الإعدادات واللغات -->
    <div id="settings-section" class="section">
        <p style="margin-bottom: 10px; font-size: 0.9rem; color: #a0abc0;" id="select-lang-text">Select Language:</p>
        <select id="language-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ar">العربية (Arabic)</option>
            <option value="fr">Français (French)</option>
            <option value="es">Español (Spanish)</option>
            <option value="de">Deutsch (German)</option>
            <option value="it">Italiano (Italian)</option>
            <option value="pt">Português (Portuguese)</option>
            <option value="ru">Русский (Russian)</option>
            <option value="zh">中文 (Chinese)</option>
            <option value="ja">日本語 (Japanese)</option>
            <option value="ko">한국어 (Korean)</option>
            <option value="tr">Türkçe (Turkish)</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="ur">اردو (Urdu)</option>
            <option value="fa">فارسی (Persian)</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="nl">Nederlands (Dutch)</option>
            <option value="pl">Polski (Polish)</option>
            <option value="vi">Tiếng Việt (Vietnamese)</option>
            <option value="th">ไทย (Thai)</option>
            <option value="el">Ελληνικά (Greek)</option>
            <option value="sv">Svenska (Swedish)</option>
            <option value="no">Norsk (Norwegian)</option>
            <option value="da">Dansk (Danish)</option>
            <option value="fi">Suomi (Finnish)</option>
            <option value="cs">Čeština (Czech)</option>
            <option value="hu">Magyar (Hungarian)</option>
            <option value="ro">Română (Romanian)</option>
            <option value="uk">Українська (Ukrainian)</option>
        </select>
        <button onclick="toggleSettings()" id="back-btn" style="margin-top: 10px;">Back</button>
    </div>

    <!-- شاشة إدخال المفتاح السري -->
    <div id="key-section" class="section active">
        <p id="key-prompt" style="margin-bottom: 15px; font-size: 0.9rem; color: #a0abc0;">Enter secret invite key to enter:</p>
        <input type="text" id="access-key" placeholder="Enter key (e.g. SECRET2026)">
        <button onclick="verifyKey()" id="enter-btn">Open Portal</button>
        <div id="key-alert" class="alert"></div>
    </div>

    <!-- الشاشة الرئيسية للبوح والاستقبال -->
    <div id="app-section" class="section">
        <!-- صندوق مفتاح الدعوة الخاص بالمستخدم -->
        <div class="invite-box" id="user-invite-box">
            🔑 <span id="invite-title-text">Your Invite Key:</span> <strong id="my-invite-key">---</strong>
        </div>

        <textarea id="secret-input" placeholder="Type a secret, confession, or feeling..."></textarea>
        <button onclick="sendEcho()" id="send-btn">Release Echo</button>

        <div class="feed" id="echo-feed">
            <div class="echo-card">
                <span id="sample-echo">"Sometimes digital crowds feel like the loneliest place..."</span>
                <br>
                <button class="glow-btn" onclick="addGlow(this)">✨ Glow (1)</button>
            </div>
        </div>
    </div>
</div>

<script>
    const translations = {
        en: {
            title: "Echo",
            subtitle: "The Secret World of Anonymous Confessions",
            selectLang: "Select Language:",
            back: "Back",
            keyPrompt: "Enter secret invite key to enter:",
            keyPlaceholder: "Enter key (e.g. SECRET2026)",
            enterBtn: "Open Portal",
            inputPlaceholder: "Type a secret, confession, or feeling...",
            sendBtn: "Release Echo",
            sampleEcho: '"Sometimes digital crowds feel like the loneliest place..."',
            inviteText: "Your Invite Key to share:",
            wrongKey: "Incorrect or used key!"
        },
        ar: {
            title: "صَـدَى",
            subtitle: "عالم البوح الخفي والرسائل المجهولة",
            selectLang: "اختر لغة التطبيق:",
            back: "رجوع",
            keyPrompt: "أدخل مفتاح الدعوة السري لدخول المعبد الرقمي:",
            keyPlaceholder: "أدخل المفتاح هنا (مثال: SECRET2026)",
            enterBtn: "فتح البوابة السريّة",
            inputPlaceholder: "اكتب سراً، فضفضة، أو شعوراً لا يعلمه أحد...",
            sendBtn: "إطلاق البوح في المحيط",
            sampleEcho: '"أحياناً أشعر أن العالم الرقمي المزدحم هو أكثر الأماكن عزلة..."',
            inviteText: "مفتاح دعوتك الخاص لمشاركته:",
            wrongKey: "مفتاح غير صحيح أو مستخدم!"
        },
        fr: {
            title: "Echo",
            subtitle: "Le monde secret des confessions anonymes",
            selectLang: "Sélectionner la langue :",
            back: "Retour",
            keyPrompt: "Entrez la clé d'invitation secrète :",
            keyPlaceholder: "Entrez la clé (ex: SECRET2026)",
            enterBtn: "Ouvrir le portail",
            inputPlaceholder: "Tapez un secret, une confession ou un sentiment...",
            sendBtn: "Libérer l'écho",
            sampleEcho: '"Parfois, la foule numérique est l\'endroit le plus solitaire..."',
            inviteText: "Votre clé d'invitation à partager :",
            wrongKey: "Clé incorrecte ou déjà utilisée !"
        },
        es: {
            title: "Echo",
            subtitle: "El mundo secreto de las confesiones anónimas",
            selectLang: "Seleccionar idioma:",
            back: "Volver",
            keyPrompt: "Ingrese la clave secreta de invitación:",
            keyPlaceholder: "Ingrese la clave (ej. SECRET2026)",
            enterBtn: "Abrir Portal",
            inputPlaceholder: "Escribe un secreto, confesión o sentimiento...",
            sendBtn: "Liberar Eco",
            sampleEcho: '"A veces las multitudes digitales se sienten como el lugar más solitario..."',
            inviteText: "Tu clave de invitación para compartir:",
            wrongKey: "¡Clave incorrecta o ya utilizada!"
        }
    };

    let currentLang = 'en';

    function changeLanguage(lang) {
        currentLang = lang;
        const t = translations[lang] || translations.en;
        const root = document.getElementById('html-root');
        
        if (lang === 'ar' || lang === 'ur' || lang === 'fa') {
            root.setAttribute('dir', 'rtl');
            root.setAttribute('lang', lang);
        } else {
            root.setAttribute('dir', 'ltr');
            root.setAttribute('lang', lang);
        }

        document.getElementById('app-title').innerText = t.title;
        document.getElementById('app-subtitle').innerText = t.subtitle;
        document.getElementById('select-lang-text').innerText = t.selectLang;
        document.getElementById('back-btn').innerText = t.back;
        document.getElementById('key-prompt').innerText = t.keyPrompt;
        document.getElementById('access-key').placeholder = t.keyPlaceholder;
        document.getElementById('enter-btn').innerText = t.enterBtn;
        document.getElementById('invite-title-text').innerText = t.inviteText;
        document.getElementById('secret-input').placeholder = t.inputPlaceholder;
        document.getElementById('send-btn').innerText = t.sendBtn;
        document.getElementById('sample-echo').innerText = t.sampleEcho;
        
        toggleSettings();
    }

    function toggleSettings() {
        const keySec = document.getElementById('key-section');
        const setSec = document.getElementById('settings-section');
        const appSec = document.getElementById('app-section');
        
        if (setSec.classList.contains('active')) {
            setSec.classList.remove('active');
            if (appSec.dataset.entered === "true") {
                appSec.classList.add('active');
            } else {
                keySec.classList.add('active');
            }
        } else {
            keySec.classList.remove('active');
            appSec.classList.remove('active');
            setSec.classList.add('active');
        }
    }

    // توليد مفتاح دعوة عشوائي فريد للمستخدم
    function generateUserKey() {
        const randomKey = "ECHO-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        document.getElementById('my-invite-key').innerText = randomKey;
    }

    async function verifyKey() {
        const key = document.getElementById('access-key').value.trim();
        const alertBox = document.getElementById('key-alert');
        alertBox.innerText = "";

        if (!key) {
            alertBox.innerText = "Please enter the key!";
            return;
        }

        // قبول المفتاح التجريبي أو أي مفتاح مُولّد يبدأ بـ ECHO-
        if (key === "SECRET2026" || key.startsWith("ECHO-")) {
            document.getElementById('key-section').classList.remove('active');
            const appSec = document.getElementById('app-section');
            appSec.classList.add('active');
            appSec.dataset.entered = "true";
            generateUserKey(); // توليد مفتاح خاص بهذا المستخدم لمشاركته
        } else {
            const t = translations[currentLang] || translations.en;
            alertBox.innerText = t.wrongKey;
        }
    }

    function sendEcho() {
        const input = document.getElementById('secret-input');
        const content = input.value.trim();
        if (!content) return;

        renderNewEcho(content);
        input.value = "";
    }

    function renderNewEcho(text) {
        const feed = document.getElementById('echo-feed');
        const card = document.createElement('div');
        card.className = 'echo-card';
        card.innerHTML = `
            "${text}"
            <br>
            <button class="glow-btn" onclick="addGlow(this)">✨ Glow (0)</button>
        `;
        feed.prepend(card);
    }

    function addGlow(btn) {
        let text = btn.innerText;
        let count = parseInt(text.match(/\d+/)[0]) + 1;
        btn.innerText = `✨ Glow (${count})`;
    }
</script>

</body>
</html>
